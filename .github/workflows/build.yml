name: Build Windows Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
      - name: Upload Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: ClickBuffer-Windows
          path: '**/*.geode'
